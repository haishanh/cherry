name: Deploy workflow
on: [push, pull_request]
concurrency:
  group: push-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        name: Install pnpm
        with:
          run_install: false
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - run: pnpm i --frozen-lockfile
      - run: pnpm lint
      - run: pnpm sync
      - run: pnpm check
      - run: pnpm fetch:signal-tokenizer
      - run: pnpm test --run
      - run: pnpm build
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser tests
        run: pnpm exec playwright test
      - name: Upload browser test failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-test-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Send Notification
        uses: haishanh/actions-telegram-notification@aff3b256bb3442512e91f888532ab6f2857c06ef
        if: ${{ always() && github.event_name == 'push' }}
        with:
          notification-token: ${{ secrets.TG_NOTIFICATION_TOKEN }}
          job-status: ${{ job.status }}
  docker-build:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    if: >
      github.event_name == 'push' &&
      (
        startsWith(github.event.ref, 'refs/tags/') ||
        startsWith(github.event.ref, 'refs/heads/v') ||
        github.event.ref == 'refs/heads/main' ||
        github.event.ref == 'refs/heads/test'
      )
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: set-images
        with:
          script: |
            const images = [];
            // "ref" like "refs/heads/v0.0.9-rc.4",
            if (context.eventName === 'push' && context.ref.startsWith('refs/heads/v') && /-rc\.[\d]+/.test(context.ref)) {
              images.push('r.haishan.me/haishanh/cherry');
            } else {
              images.push('haishanh/cherry');
              images.push('ghcr.io/haishanh/cherry');
            }
            return images.join('\n');
          result-encoding: string

      - name: Docker meta
        id: docker_meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.set-images.outputs.result }}
          flavor: |
            suffix=-${{ matrix.arch }},onlatest=true

      - name: Set git commit sha
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          version: latest

      - name: Login to r.haishan.me
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: r.haishan.me
          username: ${{ github.actor }}
          password: ${{ secrets.R_HAISHAN_ME_PASSWORD }}
      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.platform }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          build-args: |
            COMMIT_SHA=${{ env.sha_short }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=min,scope=${{ matrix.arch }}

  docker-manifest:
    needs: docker-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: set-images
        with:
          script: |
            const images = [];
            // "ref" like "refs/heads/v0.0.9-rc.4",
            if (context.eventName === 'push' && context.ref.startsWith('refs/heads/v') && /-rc\.[\d]+/.test(context.ref)) {
              images.push('r.haishan.me/haishanh/cherry');
            } else {
              images.push('haishanh/cherry');
              images.push('ghcr.io/haishanh/cherry');
            }
            return images.join('\n');
          result-encoding: string

      - name: Docker meta
        id: docker_meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.set-images.outputs.result }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          version: latest

      - name: Login to r.haishan.me
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: r.haishan.me
          username: ${{ github.actor }}
          password: ${{ secrets.R_HAISHAN_ME_PASSWORD }}
      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-architecture manifests
        env:
          TAGS: ${{ steps.docker_meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            docker buildx imagetools create \
              --tag "$tag" \
              "${tag}-amd64" \
              "${tag}-arm64"
          done <<< "$TAGS"

      - name: Generate summary
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TAGS: ${{ steps.docker_meta.outputs.tags }}
        with:
          script: |
            core.summary.addHeading('Docker Images', '2');
            core.summary.addEOL();
            core.summary.addCodeBlock(`${process.env.TAGS}`);
            core.summary.addEOL();
            core.summary.write();

      - name: Send Notification
        uses: haishanh/actions-telegram-notification@aff3b256bb3442512e91f888532ab6f2857c06ef
        if: ${{ always() }}
        with:
          notification-token: ${{ secrets.TG_NOTIFICATION_TOKEN }}
          job-status: ${{ job.status }}
